[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "supermomentum"
version = "0.1.0"
description = "CSI 931743 momentum dashboard and auditable daily reports"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exchange-calendars==4.11.2",
    "numpy==2.4.2",
    "pydantic==2.12.5",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==9.0.2",
    "ruff==0.15.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supermomentum"]
force-include = { "src/supermomentum/defaults.toml" = "supermomentum/defaults.toml" }

[tool.ruff]
required-version = "==0.15.4"
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "UP",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
namespace_packages = false
warn_unreachable = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = ["exchange_calendars.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "-ra",
]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
